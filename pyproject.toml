[project]
name = "canonical-evaluation-protocol"
version = "0.1.0"
description = "Canonical Evaluation Protocol for evidence-backed AI and organizational capability benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typing-extensions>=4.12.0",
    "typer>=0.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.21",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
cep = "cep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cep"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FBT003",
    "ISC001",
    "TC001",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "PLR2004",
    "S101",
]
"tests/**/*.py" = [
    "D",
    "PLR2004",
    "S101",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
